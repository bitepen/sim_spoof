plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lighty.simspoof'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lighty.simspoof'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}